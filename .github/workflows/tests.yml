name: EVOLVE tests

on:
  push:
    branches: ["main", "stage-2-training-execution", "audit/pre-stage-6-full-system"]
  pull_request:
    branches: ["main"]

jobs:
  current-regression:
    name: Current EVOLVE Stage 0-5 regression
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      ENV: development
      JWT_SECRET_KEY: ci-jwt-secret-key-32-bytes-minimum-for-tests
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q test_training_execution.py test_training_ui.py test_training_set_validation.py test_training_today.py test_core_foundation.py test_core_planning_contract.py test_frontend_hosting.py test_goals.py test_goals_api.py test_nutrition_foundation.py test_training_result_provenance.py test_pre_stage6_audit.py

  legacy-baseline:
    name: Legacy regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: sqlite:///./ci_legacy.db
      ENV: development
      JWT_SECRET_KEY: ci-jwt-secret-key-32-bytes-minimum-for-tests
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_diet.py test_macros.py test_main.py test_etap1.py test_etap2_structure.py test_etap3_full.py test_etap4.py test_day_tracker.py test_weekly_analysis.py test_sport_drills.py test_exercise_descriptions.py

  migration-integrity:
    name: Alembic clean-database integrity
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_migration.db
      ENV: development
      JWT_SECRET_KEY: ci-jwt-secret-key-32-bytes-minimum-for-tests
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - run: python -m alembic heads --check
