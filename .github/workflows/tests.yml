name: EVOLVE tests

on:
  push:
    branches: ["main", "stage-2-training-execution", "audit/pre-stage-6-full-system"]
  pull_request:
    branches: ["main"]

jobs:
  full-regression:
    name: Full pytest regression
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      ENV: development
      JWT_SECRET_KEY: ci-jwt-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q

  migration-integrity:
    name: Alembic clean-database integrity
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_migration.db
      ENV: development
      JWT_SECRET_KEY: ci-jwt-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m alembic current
