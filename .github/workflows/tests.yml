name: EVOLVE tests

on:
  push:
    branches: ["main", "stage-2-training-execution"]
  pull_request:
    branches: ["main"]

jobs:
  modular:
    name: Modular regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q test_training_execution.py

  legacy-baseline:
    name: Legacy regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
